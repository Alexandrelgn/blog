<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Écrits — Alexandre Ligneul</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="icon" href="assets/site/favicon.ico"/>
  <link rel="stylesheet" href="style.css" />
  <style>
    .article-featured {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 3rem; align-items: center;
      padding: 2.5rem 0 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
      text-decoration: none; color: inherit;
      transition: opacity 0.2s;
    }
    .article-featured:hover { opacity: 0.85; }
    .article-featured-thumb {
      aspect-ratio: 16/9; overflow: hidden;
      background: linear-gradient(135deg, #d4e0ec, #b8cce0);
    }
    .article-featured-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; display: block; }
    .article-featured:hover .article-featured-thumb img { transform: scale(1.03); }
    .article-featured-badge {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--accent); background: var(--accent-light);
      display: inline-block; padding: 0.25rem 0.75rem; margin-bottom: 1rem;
    }
    .article-featured-title { font-family: var(--serif); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 600; line-height: 1.25; margin-bottom: 1rem; }
    .article-featured-excerpt { font-size: 0.95rem; color: #555; line-height: 1.7; margin-bottom: 1.25rem; }
    .article-featured-meta { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; padding: 0 0 2rem; border-bottom: none; margin-bottom: 2rem; }

    .articles-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 5rem; }
    .article-card-full {
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      border: 1px solid var(--border);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .article-card-full:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(45,90,142,0.08); }
    .article-card-thumb { aspect-ratio: 3/2; overflow: hidden; }
    .article-card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; display: block; }
    .article-card-full:hover .article-card-thumb img { transform: scale(1.04); }
    .thumb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .thumb-ph span { font-size: 0.68rem; color: rgba(45,90,142,0.4); text-transform: uppercase; letter-spacing: 0.1em; }
    .article-card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .article-card-cat { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); display: block; margin-bottom: 0.6rem; }
    .article-card-title { font-family: var(--serif); font-size: 1.05rem; line-height: 1.35; margin-bottom: 0.6rem; }
    .article-card-excerpt { font-size: 0.82rem; color: #666; line-height: 1.6; margin-bottom: 1rem; flex: 1; }
    .article-card-meta { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .article-card-read { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 500; }

    .article-card-thumb {
  aspect-ratio: 3/2;
  overflow: hidden;
  background: #e8e4dc;
}

    .article-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.5s;
    }

    /* Chapeaux tronqués pour garder des cartes de hauteur régulière */
    .article-card-excerpt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .article-featured-excerpt { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .thumb-ph { background: linear-gradient(135deg, #d4e0ec, #b8cce0); }
    .articles-status { grid-column: 1 / -1; padding: 2rem; border: 1px dashed var(--border); color: var(--muted); font-size: 0.9rem; text-align: center; }

    @media (max-width: 860px) {
      .article-featured { grid-template-columns: 1fr; gap: 1.5rem; }
      .articles-list { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .articles-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Alexandre <span>Ligneul</span></a>
    <ul class="nav-links">
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Vidéos</a></li>
      <li><a href="articles.html" class="active">Écrits</a></li>
      <li><a href="podcasts.html">Podcasts</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="container">

    <header class="page-header reveal">
      <p class="breadcrumb"><a href="index.html">Accueil</a><span>/</span>Écrits</p>
      <h1 class="page-title">Reportages écrits</h1>
      <p class="page-subtitle">Enquêtes, portraits et analyses de terrain</p>
    </header>

    <!-- À LA UNE (générée) -->
    <div id="featured"></div>

    <!-- FILTRES (générés à partir des catégories) -->
    <div class="filters reveal" id="filters"></div>

    <!-- GRILLE (générée) -->
    <div class="articles-list reveal" id="articles-grid">
      <p class="articles-status">Chargement des articles…</p>
    </div>
  </div>

  <footer>
    <span>© 2026 Alexandre Ligneul</span>
    <span>Portfolio · <a href="mentions-legales.html" style="color:#888582;">Mentions légales</a></span>
  </footer>

  <script src="assets/articles/liste-articles.js"></script>
  <script>
    function thumbHtml(a, cls) {
      return a.image
        ? `<div class="${cls}"><img src="${escapeHtml(a.image)}" alt="${escapeHtml(a.imageAlt)}" loading="lazy" /></div>`
        : `<div class="${cls}"><div class="thumb-ph"><span>${escapeHtml(a.category)}</span></div></div>`;
    }

    function featuredHtml(a) {
      return `
        <a href="${escapeHtml(a.href)}" class="article-featured reveal">
          ${thumbHtml(a, 'article-featured-thumb')}
          <div>
            <span class="article-featured-badge">À la une</span>
            <h2 class="article-featured-title">${escapeHtml(a.title)}</h2>
            <p class="article-featured-excerpt">${escapeHtml(a.excerpt)}</p>
            <p class="article-featured-meta">${escapeHtml([a.category, a.date].filter(Boolean).join(' · '))}</p>
          </div>
        </a>`;
    }

    function cardHtml(a) {
      return `
        <a href="${escapeHtml(a.href)}" class="article-card-full" data-category="${escapeHtml(slugify(a.category))}">
          ${thumbHtml(a, 'article-card-thumb')}
          <div class="article-card-body">
            <span class="article-card-cat">${escapeHtml(a.category)}</span>
            <h3 class="article-card-title">${escapeHtml(a.title)}</h3>
            <p class="article-card-excerpt">${escapeHtml(a.excerpt)}</p>
            <div class="article-card-meta"><span>${escapeHtml([a.date, a.readTime].filter(Boolean).join(' · '))}</span><span class="article-card-read">Lire →</span></div>
          </div>
        </a>`;
    }

    // ── FILTRES ──
    function renderFilters(list) {
      const cats = [];
      list.forEach(a => { if (a.category && !cats.some(c => slugify(c) === slugify(a.category))) cats.push(a.category); });
      const filters = document.getElementById('filters');
      if (cats.length < 2) { filters.remove(); return; }
      filters.innerHTML = `<button class="filter-btn active" data-filter="all">Tout</button>` +
        cats.map(c => `<button class="filter-btn" data-filter="${escapeHtml(slugify(c))}">${escapeHtml(c)}</button>`).join('');
      filters.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const f = btn.dataset.filter;
          document.querySelectorAll('.article-card-full').forEach(card => {
            card.style.display = (f === 'all' || card.dataset.category === f) ? 'flex' : 'none';
          });
        });
      });
    }

    // ── GÉNÉRATION DE LA PAGE ──
    async function renderArticles() {
      const grid = document.getElementById('articles-grid');
      const loaded = await loadAllArticles();

      if (!loaded.length) {
        grid.innerHTML = `<p class="articles-status">${escapeHtml(articlesErrorMessage())}</p>`;
        return;
      }

      const featured = loaded.find(a => a.featured);
      if (featured) document.getElementById('featured').innerHTML = featuredHtml(featured);

      // L'article « À la une » apparaît aussi dans la grille pour rester accessible via les filtres
      grid.innerHTML = loaded.map(cardHtml).join('');
      renderFilters(loaded);

      document.querySelectorAll('.reveal:not(.visible)').forEach(el => obs.observe(el));
    }

    // ── SCROLL REVEAL ──
    const obs = new IntersectionObserver(entries => {
      entries.forEach((e, i) => { if (e.isIntersecting) { e.target.style.transitionDelay=(i*0.08)+'s'; e.target.classList.add('visible'); }});
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    renderArticles();
  </script>

</body>
</html>
