<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photographies — Alexandre Ligneul</title>
  <link rel="icon" href="assets/site/favicon.ico"/>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Styles propres à la page Photos ; le reste (menu, en-tête, pied de page…) est dans style.css */

    /* ── FILTERS ── */
    .filters {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .filter-btn {
      padding: 0.4rem 1rem;
      border: 1px solid var(--border);
      background: none; cursor: pointer;
      font-family: var(--sans); font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent); background: var(--accent-light);
    }

    /* ── MASONRY GRID ── */
    .masonry {
      columns: 3; gap: 12px;
    }
    .masonry-item {
      break-inside: avoid; margin-bottom: 12px;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .masonry-item img {
      width: 100%; display: block;
      transition: transform 0.5s, filter 0.4s;
      filter: grayscale(8%);
    }
    .masonry-item:hover img { transform: scale(1.03); filter: grayscale(0%); }
    .masonry-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 2rem 1rem 0.85rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      opacity: 0; transition: opacity 0.3s;
    }
    .masonry-item:hover .masonry-caption { opacity: 1; }
    .masonry-caption-title {
      color: white; font-size: 0.82rem; display: block;
      margin-bottom: 0.2rem;
    }
    .masonry-caption-meta {
      color: rgba(255,255,255,0.6); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.93);
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative; max-width: 90vw;
      display: flex; align-items: center; gap: 1.5rem;
    }
    /* Cadre de la photo agrandie : porte le calque qui la protège (style.css) */
    .lightbox-frame { position: relative; display: flex; }
    .lightbox-img {
      max-width: 80vw; max-height: 65vh;
      object-fit: contain;
    }
    .lightbox-close {
      position: fixed; top: 1.5rem; right: 2rem;
      color: rgba(255,255,255,0.6); font-size: 1.5rem;
      cursor: pointer; background: none; border: none;
      transition: color 0.2s; line-height: 1;
    }
    .lightbox-close:hover { color: white; }
    .lightbox-nav {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7); width: 2.5rem; height: 2.5rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
      transition: all 0.2s;
    }
    .lightbox-nav:hover { border-color: white; color: white; }
    .lightbox-info {
      margin-top: 1.25rem;
      text-align: center;
      padding: 0 1rem;
    }
    .lightbox-info-title {
      color: white;
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .lightbox-info-meta {
      color: rgba(255,255,255,0.8);
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-top: 0.4rem;
    }
    .lightbox-info-alt {
      color: rgba(255,255,255,0.65);
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.85rem;
      margin-top: 0.6rem;
      max-width: 600px;
      margin-left: auto; margin-right: auto;
      line-height: 1.6;
    }
    .lightbox-counter {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.4); font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.12em;
    }

    @media (max-width: 768px) {
      .masonry { columns: 2; }
      .lightbox-nav { display: none; }
    }
    @media (max-width: 480px) {
      .masonry { columns: 1; }
    }
  </style>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
</head>
<body>

  <nav>
    <a href="./" class="nav-logo">Alexandre <span>Ligneul</span></a>
    <ul class="nav-links">
      <li><a href="photos" class="active">Photos</a></li>
      <li><a href="videos">Vidéos</a></li>
      <li><a href="articles">Écrits</a></li>
      <li><a href="podcasts">Podcasts</a></li>
      <li><a href="./#contact">Contact</a></li>
    </ul>
  </nav>

  <main class="container page-body">
    <header class="page-header reveal">
      <p class="breadcrumb"><a href="./">Accueil</a><span>/</span>Photographies</p>
      <h1 class="page-title">Photographies</h1>
      <p class="page-subtitle">Reportages, portraits et instants saisis sur le terrain</p>
    </header>

    <!-- Filtres et galerie générés à partir de assets/photos/liste-photos.js -->
    <div class="filters reveal" id="filters">
      <button class="filter-btn active" data-filter="all">Tout</button>
    </div>

    <div class="masonry reveal" id="gallery"></div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">✕</button>
    <div class="lightbox-counter" id="lb-counter"></div>
    <div class="lightbox-inner">
      <button class="lightbox-nav" id="lb-prev">‹</button>
      <div class="lightbox-frame"><img class="lightbox-img" id="lb-img" src="" alt="" /></div>
      <button class="lightbox-nav" id="lb-next">›</button>
    </div>
    <div class="lightbox-info">
      <div class="lightbox-info-title" id="lb-title"></div>
      <div class="lightbox-info-meta" id="lb-meta"></div>
      <div class="lightbox-info-alt" id="lb-alt"></div>
    </div>
  </div>

  <footer>
    <span>© 2026 Alexandre Ligneul</span>
    <span>Portfolio · <a href="mentions-legales" style="color:inherit;">Mentions légales</a></span>
  </footer>

  <script src="assets/photos/liste-photos.js"></script>
  <script>
    // ── GÉNÉRATION DE LA GALERIE (filtres, photos, ouverture de la visionneuse) ──
    async function renderGallery() {
      const photos = await loadPhotos();

      // Boutons de filtre : un par catégorie utilisée dans la liste
      document.getElementById('filters').insertAdjacentHTML('beforeend', photoCategories(photos).map(c =>
        `<button class="filter-btn" data-filter="${escapeHtml(c.id)}">${escapeHtml(c.label)}</button>`
      ).join(''));

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = photos.map(photo => `
          <div class="masonry-item" data-category="${escapeHtml(photo.category)}" data-title="${escapeHtml(photo.title)}" data-meta="${escapeHtml(photo.meta)}" data-alt="${escapeHtml(photo.alt)}">
            <img src="${escapeHtml(photoSrc(photo))}" alt="${escapeHtml(photo.title)}" loading="lazy" />
            <div class="masonry-caption">
              <span class="masonry-caption-title">${escapeHtml(photo.title)}</span>
              <span class="masonry-caption-meta">${escapeHtml(photo.meta)}</span>
            </div>
          </div>`).join('');

      // Filtres
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const f = btn.dataset.filter;
          document.querySelectorAll('.masonry-item').forEach(item => {
            item.style.display = (f === 'all' || item.dataset.category === f) ? '' : 'none';
          });
        });
      });

      // Un clic sur une photo ouvre la visionneuse
      document.querySelectorAll('.masonry-item').forEach(item => {
        item.addEventListener('click', () => {
          const vis = getVisible();
          openLightbox(vis.indexOf(item));
        });
      });
    }

    // ── LIGHTBOX ──
    let current = 0;
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lb-img');
    const lbTitle = document.getElementById('lb-title');
    const lbMeta  = document.getElementById('lb-meta');
    const lbAlt   = document.getElementById('lb-alt');
    const lbCounter = document.getElementById('lb-counter');

    function getVisible() {
      return [...document.querySelectorAll('.masonry-item')].filter(i => i.style.display !== 'none');
    }
    function openLightbox(idx) {
      const vis = getVisible();
      current = idx;
      const item = vis[idx];
      const imgEl = item.querySelector('img');
      if (!imgEl) return;
      lbImg.src = imgEl.src;
      lbTitle.textContent   = item.dataset.title || '';
      lbMeta.textContent    = item.dataset.meta  || '';
      lbAlt.textContent     = item.dataset.alt   || '';
      lbCounter.textContent = `${idx + 1} / ${vis.length}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
    function navigate(dir) {
      const vis = getVisible();
      current = (current + dir + vis.length) % vis.length;
      openLightbox(current);
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => navigate(-1));
    document.getElementById('lb-next').addEventListener('click', () => navigate(1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   navigate(-1);
      if (e.key === 'ArrowRight')  navigate(1);
    });

    // ── SCROLL REVEAL ──
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    renderGallery();
  </script>
</body>
</html>
