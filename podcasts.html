<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcasts — Alexandre Ligneul</title>
  <link rel="icon" href="assets/site/favicon.ico"/>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1a1a1a; --bg: #fff; --soft: #f5f4f2; --border: #e8e6e2; --muted: #888582; --accent: #2d5a8e; --accent-light: #e8f0f9; --serif: 'Lora', Georgia, serif; --sans: 'Inter', sans-serif; }
    html { height: 100%; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.7;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2.5rem; background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    .nav-logo { font-family: var(--serif); font-size: 1rem; text-decoration: none; color: var(--ink); }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; text-decoration: none; color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-links a.active { font-weight: 500; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 2.5rem; }
    .page-header { padding: 4rem 0 2.5rem; }
    .breadcrumb { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 1.25rem; }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { margin: 0 0.5rem; }
    .page-title { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3rem); font-weight: 600; margin-bottom: 0.5rem; }
    .page-subtitle { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.1rem; }
    .episodes-list { margin-bottom: 5rem; }
    .ep { display: grid; grid-template-columns: 2.5rem 1fr auto; gap: 1.25rem; align-items: start; padding: 1.5rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; border-radius: 2px; }
    .ep:first-child { border-top: 1px solid var(--border); }
    .ep:hover { background: var(--soft); }
    .ep.playing { background: var(--accent-light); }
    .ep-num { font-family: var(--serif); font-style: italic; font-size: 1rem; color: var(--border); text-align: center; padding-top: 0.2rem; transition: color 0.2s; }
    .ep:hover .ep-num, .ep.playing .ep-num { color: var(--accent); }
    .ep-title { font-family: var(--serif); font-size: 1.05rem; line-height: 1.35; margin-bottom: 0.35rem; }
    .ep-desc { font-size: 0.82rem; color: #666; line-height: 1.6; margin-bottom: 0.5rem; }
    .ep-meta { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .ep-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.75rem; padding-top: 0.25rem; }
    .ep-dur { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .ep-btn { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, background 0.2s; }
    .ep:hover .ep-btn, .ep.playing .ep-btn { border-color: var(--accent); background: var(--accent); }
    .ep-btn svg { width: 0.65rem; fill: var(--ink); margin-left: 1px; }
    .ep:hover .ep-btn svg, .ep.playing .ep-btn svg { fill: white; }
    footer { margin-top: auto; background: #0d0d0d; padding: 1.2rem 2.5rem; display: flex; justify-content: space-between; font-size: 0.7rem; color: #3a3a3a; text-transform: uppercase; letter-spacing: 0.1em; }
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.65s, transform 0.65s; }
    .reveal.visible { opacity: 1; transform: none; }
    @media (max-width: 680px) { nav { padding: 1rem 1.25rem; } .container { padding: 0 1.25rem; } .ep { grid-template-columns: 2rem 1fr; } .ep-right { display: none; } }
    a.ep { text-decoration: none; color: inherit; display: grid; }
    .ep { display: grid; grid-template-columns: 80px 1fr auto; gap: 1.25rem; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; border-radius: 2px; }
    .ep-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      object-position: center;
      display: block;
      flex-shrink: 0;
      border-radius: 4px;
    }
    /* Téléphone : le menu passe sous le nom, sur toute la largeur (même règle dans style.css et les autres pages) */
    @media (max-width: 680px) {
      nav { flex-wrap: wrap; row-gap: 0.55rem; }
      .nav-links { width: 100%; flex-wrap: wrap; justify-content: space-between; gap: 0.4rem 0.6rem; }
      .nav-links a { font-size: 0.72rem; letter-spacing: 0.06em; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="./" class="nav-logo">Alexandre <span>Ligneul</span></a>
    <ul class="nav-links">
      <li><a href="photos">Photos</a></li>
      <li><a href="videos">Vidéos</a></li>
      <li><a href="articles">Écrits</a></li>
      <li><a href="podcasts" class="active">Podcasts</a></li>
      <li><a href="./#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <header class="page-header reveal">
      <p class="breadcrumb"><a href="./">Accueil</a><span>/</span>Podcasts</p>
      <h1 class="page-title">Podcasts</h1>
      <p class="page-subtitle">Épisodes audio, séries et reportages sonores</p>
    </header>

    <!-- Générée à partir de assets/podcasts/liste-podcasts.js -->
    <div class="episodes-list reveal" id="episodes">
      </div>
    </div>
  </div>

  <footer><span>© 2026 Alexandre Ligneul</span><span>Portfolio · <a href="mentions-legales" style="color:inherit;">Mentions légales</a></span></footer>

  <script src="assets/podcasts/liste-podcasts.js"></script>
  <script>
    // ── ÉPISODES : toute la liste, dans l'ordre ──
    function episodeHtml(p) {
      const meta = [p.series, p.episode ? 'Épisode ' + p.episode : '', p.date].filter(Boolean).join(' · ');
      return `
      <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" class="ep">
        <img class="ep-thumb" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.alt)}" />
        <div>
          <p class="ep-title">${escapeHtml(p.title)}</p>
          <p class="ep-desc">${escapeHtml(p.description)}</p>
          <p class="ep-meta">${escapeHtml(meta)}</p>
        </div>
        <div class="ep-right">
          <span class="ep-dur">${escapeHtml(p.duration)}</span>
          <div class="ep-btn">${PODCAST_PLAY_SVG}</div>
        </div>
      </a>`;
    }

    async function renderEpisodes() {
      const list = await loadAllPodcasts();
      document.getElementById('episodes').innerHTML = list.map(episodeHtml).join('');
    }
    renderEpisodes();
  </script>
  <script>
    const obs = new IntersectionObserver(es => {
      es.forEach((e, i) => { if (e.isIntersecting) { e.target.style.transitionDelay=(i*0.08)+'s'; e.target.classList.add('visible'); }});
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>
</body>
</html>
