<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcasts — Alexandre Ligneul</title>
  <link rel="icon" href="assets/site/favicon.ico"/>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Styles propres à la page Podcasts ; le reste est dans style.css */
    .container { max-width: 900px; }
    a.ep { text-decoration: none; color: inherit; display: grid; }
    /* Miniature à gauche de chaque épisode */
    .ep { grid-template-columns: 80px 1fr auto; align-items: center; padding: 1rem; }
    .ep-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      object-position: center;
      display: block;
      flex-shrink: 0;
      border-radius: 4px;
    }
    @media (max-width: 680px) { .ep-right { display: none; } }
  </style>
</head>
<body>
  <nav>
    <a href="./" class="nav-logo">Alexandre <span>Ligneul</span></a>
    <ul class="nav-links">
      <li><a href="photos">Photos</a></li>
      <li><a href="videos">Vidéos</a></li>
      <li><a href="articles">Écrits</a></li>
      <li><a href="podcasts" class="active">Podcasts</a></li>
      <li><a href="./#contact">Contact</a></li>
    </ul>
  </nav>

  <main class="container">
    <header class="page-header reveal">
      <p class="breadcrumb"><a href="./">Accueil</a><span>/</span>Podcasts</p>
      <h1 class="page-title">Podcasts</h1>
      <p class="page-subtitle">Épisodes audio, séries et reportages sonores</p>
    </header>

    <!-- Générée à partir de assets/podcasts/liste-podcasts.js -->
    <div class="episodes-list reveal" id="episodes"></div>
  </main>

  <footer><span>© 2026 Alexandre Ligneul</span><span>Portfolio · <a href="mentions-legales" style="color:inherit;">Mentions légales</a></span></footer>

  <script src="assets/podcasts/liste-podcasts.js"></script>
  <script>
    // ── ÉPISODES : toute la liste, dans l'ordre ──
    function episodeHtml(p) {
      const meta = [p.series, p.episode ? 'Épisode ' + p.episode : '', p.date].filter(Boolean).join(' · ');
      return `
      <a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" class="ep">
        <img class="ep-thumb" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.alt)}" />
        <div>
          <p class="ep-title">${escapeHtml(p.title)}</p>
          <p class="ep-desc">${escapeHtml(p.description)}</p>
          <p class="ep-meta">${escapeHtml(meta)}</p>
        </div>
        <div class="ep-right">
          <span class="ep-dur">${escapeHtml(p.duration)}</span>
          <div class="ep-btn">${PODCAST_PLAY_SVG}</div>
        </div>
      </a>`;
    }

    async function renderEpisodes() {
      const list = await loadAllPodcasts();
      document.getElementById('episodes').innerHTML = list.map(episodeHtml).join('');
    }
    renderEpisodes();
  </script>
  <script>
    const obs = new IntersectionObserver(es => {
      es.forEach((e, i) => { if (e.isIntersecting) { e.target.style.transitionDelay=(i*0.08)+'s'; e.target.classList.add('visible'); }});
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
  </script>
</body>
</html>
